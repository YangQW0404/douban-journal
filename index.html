<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豆瓣手账 · 帖子评论收藏</title>
<style>
  :root{ --paper:#faf6ef; --ink:#4a4038; --accent:#e8837b; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#efe9de;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);min-height:100vh}
  .wrap{max-width:860px;margin:0 auto;padding:20px 14px 80px}
  h1{font-size:24px;text-align:center;letter-spacing:2px;margin-bottom:6px}
  .sub{text-align:center;font-size:13px;color:#9a8f83;margin-bottom:20px}
  .navbar{display:flex;justify-content:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .navbar button{background:#fff;color:var(--ink);border:2px solid #e5dccd;font-size:14px;padding:8px 18px}
  .navbar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .authbar{text-align:center;font-size:13px;color:#8a7f83;margin-bottom:16px}
  .authbar .email{color:#e8837b}
  .authbar a{color:#e8837b;cursor:pointer;margin:0 6px}
  .authcard{max-width:380px;margin:0 auto 18px}
  .authcard .row{flex-direction:column}
  .syncNote{font-size:12px;color:#9a8f83;text-align:center;margin-top:8px;min-height:16px}
  .card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 12px rgba(90,70,40,.08);margin-bottom:18px}
  .row{display:flex;gap:10px}
  input[type=text],input[type=file-text]{flex:1;border:2px solid #e5dccd;border-radius:10px;padding:11px 14px;font-size:15px;outline:none;background:#fffdf9}
  input:focus{border-color:var(--accent)}
  button{border:none;border-radius:10px;padding:11px 20px;font-size:15px;cursor:pointer;background:var(--accent);color:#fff;transition:.15s}
  button:disabled{background:#d8cfc2;cursor:not-allowed}
  button.ghost{background:#fff;color:var(--ink);border:2px solid #e5dccd}
  button.small{padding:7px 14px;font-size:13px}
  .msg{margin-top:12px;font-size:13px;color:#b0655e;min-height:18px}
  .post-title{font-size:19px;font-weight:600;margin-bottom:6px}
  .post-meta{font-size:13px;color:#a09486;margin-bottom:4px}
  .post-link{display:inline-block;font-size:14px;color:#e8837b;margin-bottom:12px}
  .post-content{white-space:pre-wrap;font-size:14px;line-height:1.8;background:var(--paper);border-radius:10px;padding:14px 16px;max-height:240px;overflow:auto}
  .post-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .post-imgs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;font-size:13px;color:#8a7f72;flex-wrap:wrap;gap:6px}
  .toolbar b{color:var(--accent)}
  .toolbar a{color:#e8837b}
  .cmt{display:flex;gap:10px;padding:12px 8px;border-bottom:1px dashed #eee4d4;align-items:flex-start}
  .cmt input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex-shrink:0;cursor:pointer}
  .cmt .body{flex:1;cursor:pointer;min-width:0}
  .cmt .who{font-size:12px;color:#b0a494;margin-bottom:3px;display:flex;justify-content:space-between;gap:8px}
  .cmt .likes{color:#e8837b;white-space:nowrap;font-size:12px}
  .cmt .txt{font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .cmt.selected{background:#fdf3ee;border-radius:8px}
  .actions{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
  #previewBox{display:none;text-align:center}
  #imgOut{max-width:100%;width:100%;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.15);display:block}
  .saveHint{font-size:13px;color:#9a8f83;margin:10px 0}
  .more{width:100%;margin-top:14px;background:#fff;color:var(--ink);border:2px dashed #e0d5c2}
  .empty{padding:8px;font-size:13px;color:#b0a494}
  .nb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .nb-card{border:2px solid #eee4d4;border-radius:12px;overflow:hidden;cursor:pointer;background:#fffdf9}
  .nb-card:hover{border-color:var(--accent)}
  .nb-cover{width:100%;height:140px;object-fit:contain;background:var(--paper);display:block;border-bottom:1px solid #f0e8da}
  .nb-info{padding:10px 12px}
  .nb-name{font-size:15px;font-weight:600;margin-bottom:4px}
  .nb-intro{font-size:12px;color:#9a8f83;line-height:1.5;height:36px;overflow:hidden;margin-bottom:6px}
  .nb-tags{font-size:11px;color:#e8837b;margin-bottom:4px}
  .nb-date{font-size:11px;color:#c3b6a5}
  .nb-entries{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  /* 时间线视图 */
  .tl-group{margin-bottom:22px}
  .tl-date{font-size:15px;font-weight:600;color:var(--ink);padding:8px 0 10px;border-bottom:2px solid #f0e4d4;margin-bottom:12px;position:relative}
  .tl-date::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:8px}
  .tl-row{display:flex;flex-wrap:wrap;gap:10px}
  .tl-thumb{width:110px;height:150px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid #fff;box-shadow:0 2px 8px rgba(90,70,40,.15);background:var(--paper)}
  .viewSwitch{font-size:12px;color:#8a7f72;cursor:pointer;margin-left:10px}
  .viewSwitch.active{color:var(--accent);font-weight:600}
  /* 条目操作菜单 */
  .entryOps{display:flex;gap:6px;padding:6px 8px;background:#faf6ef}
  .entryOps button{flex:1;font-size:11px;padding:5px 4px;border-radius:6px;background:#fff;color:var(--ink);border:1px solid #eee4d4}
  .entry-card{border:2px solid #eee4d4;border-radius:10px;overflow:hidden;cursor:pointer;background:#fffdf9}
  .entry-thumb{width:100%;height:150px;object-fit:cover;display:block;background:var(--paper)}
  .entry-title{font-size:12px;padding:8px;line-height:1.4;height:48px;overflow:hidden;color:var(--ink)}
  .modal-mask{display:none;position:fixed;inset:0;background:rgba(60,50,40,.5);z-index:50;align-items:center;justify-content:center;padding:16px}
  .modal-mask.show{display:flex}
  .modal{background:#fff;border-radius:14px;padding:22px;max-width:440px;width:100%;max-height:88vh;overflow:auto}
  .modal h3{margin-bottom:16px;font-size:17px}
  .modal label{display:block;font-size:13px;color:#8a7f72;margin:12px 0 5px}
  .modal input[type=text],.modal textarea{width:100%;border:2px solid #e5dccd;border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit}
  .modal textarea{height:64px;resize:vertical}
  .coverPick{display:flex;align-items:center;gap:12px}
  .coverPick img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:2px solid #e5dccd}
  .del{color:#c0564e;font-size:12px;cursor:pointer;margin-left:8px}
  .backlink{font-size:13px;color:#e8837b;cursor:pointer;margin-bottom:12px;display:inline-block}
  /* 手账查看灯箱：左右滑动 */
  .lightbox{display:none;position:fixed;inset:0;background:rgba(40,32,24,.92);z-index:100;flex-direction:column}
  .lightbox.show{display:flex}
  .lb-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;color:#f0e8da;font-size:14px}
  .lb-counter{background:rgba(255,255,255,.15);padding:4px 14px;border-radius:14px}
  .lb-close{cursor:pointer;font-size:22px;color:#f0e8da;padding:4px 10px}
  .lb-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;touch-action:pan-y}
  .lb-track{display:flex;transition:transform .28s ease;height:100%;align-items:center}
  .lb-item{flex:0 0 100%;display:flex;align-items:center;justify-content:center;padding:10px;height:100%;overflow:hidden}
  .lb-item img{max-width:100%;max-height:calc(100vh - 130px);width:auto;height:auto;object-fit:contain;border-radius:6px;user-select:none;-webkit-user-drag:none}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .lb-prev{left:10px} .lb-next{right:10px}
  .lb-title{color:#c3b6a5;font-size:13px;text-align:center;padding:10px 20px 16px}
  .nb-actions{display:flex;gap:8px;margin-top:10px}
  .selNotebook{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;align-items:center}
  select{border:2px solid #e5dccd;border-radius:10px;padding:10px 12px;font-size:14px;background:#fffdf9;color:var(--ink)}
  @media (max-width:600px){
    .row{flex-direction:column}
    .wrap{padding:14px 10px 70px}
    .card{padding:14px}
    .cmt .txt{font-size:14px}
    #imgOut{width:100%}
  }
</style>

<script>
const $ = id => document.getElementById(id);
let state = { url:'', comments:[], start:0, hasMore:false };
let currentBlobUrl = null;
let currentEntry = null; // {title,url,author,time,comments,imgDataUrl}

// ============ 存储：本地 + 云端（Supabase，登录后启用） ============
const LS_KEY = 'dj_notebooks_v1'; // 仅存元数据（不含图片）的缓存键
// ============ 图片存储：IndexedDB（容量大，长图不丢） ============
const IDB_NAME = 'douban-journal', IDB_STORE = 'images';
function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(key, dataUrl){
  try{
    const db = await idbOpen();
    return new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(dataUrl, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  }catch(e){ return false; }
}
async function idbGet(key){
  try{
    const db = await idbOpen();
    return new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const r = tx.objectStore(IDB_STORE).get(key);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => resolve(null);
    });
  }catch(e){ return null; }
}
async function idbDel(key){
  try{
    const db = await idbOpen();
    return new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  }catch(e){ return false; }
}

// ============ 手账本数据：元数据存 localStorage，图片存 IndexedDB ============
function metaOf(books){ // 剥离图片为引用，避免撑爆 localStorage
  return books.map(b => ({ ...b, cover: b.cover && b.cover.startsWith('data:') ? ('idb://cover/'+b.id) : b.cover,
    entries: (b.entries||[]).map(e => ({ ...e, thumbDataUrl: undefined,
      imgDataUrl: e.imgDataUrl && e.imgDataUrl.startsWith('data:') ? ('idb://img/'+e.id) : e.imgDataUrl, fullDataUrl: undefined })) }));
}
async function saveBooks(books){
  // 图片写入 IndexedDB
  for (const b of books){
    if (b.cover && b.cover.startsWith('data:')) await idbPut('cover/'+b.id, b.cover);
    for (const e of (b.entries||[])){
      if (e.imgDataUrl && e.imgDataUrl.startsWith('data:')) await idbPut('img/'+e.id, e.imgDataUrl);
    }
  }
  // 元数据写 localStorage（小，不会超限）
  try{ localStorage.setItem(LS_KEY, JSON.stringify(metaOf(books))); }
  catch(e){ alert('保存失败：' + e.message); return false; }
  booksCache = books; // 缓存保持含图版本
  cloudSave(books); // 云端存完整数据（含图）
  return true;
}
// 同步读缓存（页面加载时 hydrate 一次）；未初始化时返回 localStorage 原始数据
function loadBooks(){ return booksCache || (booksCache = (function(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ return []; } })()); }
let booksCache = null;
let hydratePromise = null;
function ensureHydrated(){
  if (!hydratePromise) hydratePromise = hydrateBooks();
  return hydratePromise;
}
// 读取时把 idb:// 引用还原为真实图片
async function hydrateBooks(){
  const books = loadBooks();
  for (const b of books){
    if (b.cover && b.cover.startsWith('idb://')) b.cover = (await idbGet(b.cover.slice(6))) || '';
    for (const e of (b.entries||[])){
      if (e.imgDataUrl && e.imgDataUrl.startsWith('idb://')) e.imgDataUrl = (await idbGet(e.imgDataUrl.slice(6))) || '';
    }
  }
  booksCache = books;
  hydratePromise = null;
  return books;
}
const SB_URL = window.SUPABASE_URL || '';
const SB_KEY = window.SUPABASE_ANON_KEY || '';
let sb = null; // supabase client
let currentUser = null;
if (SB_URL && SB_KEY && window.supabase) {
  sb = window.supabase.createClient(SB_URL, SB_KEY);
}
async function cloudSave(books){
  if (!sb || !currentUser) return;
  try{
    await sb.from('notebooks').upsert({ user_id: currentUser.id, data: books, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
    setSyncNote('已同步到云端 ✓');
  }catch(e){ setSyncNote('云端同步失败，已保存在本地（下次打开会重试）'); }
}
async function cloudLoad(){
  if (!sb || !currentUser) return null;
  const { data, error } = await sb.from('notebooks').select('data').eq('user_id', currentUser.id).maybeSingle();
  if (error) throw error;
  return data ? data.data : null;
}
function setSyncNote(t){ const el = document.querySelector('.syncNote'); if (el) el.textContent = t; }

// ============ 登录流程 ============
function renderAuthBar(){
  const bar = $('authBar');
  if (currentUser){
    bar.style.display = 'block';

async function fetchDouban(url, start){
  const q = start !== undefined ? `?url=${encodeURIComponent(url)}&start=${start}` : `?url=${encodeURIComponent(url)}`;
  const r = await fetch('/api/douban' + q);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || '抓取失败');
  return j;
}

// ============ 评论加载（去重 + 勾选保持 + 页码） ============
let loadingMore = false;
async function loadMore(){
  if (loadingMore || !state.hasMore) return;
  loadingMore = true;
  $('moreBtn').textContent = '加载中…';
  try {
    const data = await fetchDouban(state.url, state.start);
    const news = data.comments || [];
    // 去重：按 作者+内容+时间 组合键
    const seen = new Set(state.comments.map(c => c.author+'|'+c.content+'|'+c.time));
    const fresh = news.filter(c => !seen.has(c.author+'|'+c.content+'|'+c.time));
    state.comments.push(...fresh);
    state.start += 100; // 固定步长，与豆瓣分页对齐
    state.hasMore = state.totalComments ? (state.comments.length < state.totalComments) : (news.length > 0);
    renderComments();
  } catch(e){ /* 静默，底部提示 */ }
  $('moreBtn').textContent = '下拉自动加载更多评论 ↓';
  loadingMore = false;
}

  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) loadMore();
});

  const io = new IntersectionObserver(es => { if (es[0].isIntersecting) loadMore(); }, { rootMargin: '200px' });
  io.observe($('moreBtn'));
}

    const on = checkedKeys.has(key);
    return `<div class="cmt${on?' selected':''}" data-i="${i}">
      <input type="checkbox"${on?' checked':''}>
      <div class="body">
        <div class="who"><span>${esc(c.author||'匿名')} ${c.time||''}</span><span class="likes">👍 ${c.likes||0}</span></div>
        <div class="txt">${esc(c.content)}</div>

  }).join('') || '<div class="empty">这篇帖子没有抓到评论，或帖子需要登录才能看评论。</div>';
  box.querySelectorAll('.cmt').forEach(el=>{
    const toggle = on => { el.querySelector('input').checked = on; el.classList.toggle('selected', on); updateCount(); };
    el.querySelector('input').onchange = e => toggle(e.target.checked);
    el.querySelector('.body').onclick = () => toggle(!el.querySelector('input').checked);
  });
  // 页码指示：当前已加载条数 / 豆瓣总评论数

// ============ 手账图生成（大字号适配手机） ============
const WASHI = ['rgba(249,215,168,.8)','rgba(232,131,123,.6)','rgba(176,205,166,.65)','rgba(196,181,222,.6)'];
const NOTE_BG = ['#fdf3ee','#eef4ea','#f3effb','#fdf8e3'];
const FONT = '"PingFang SC","Microsoft YaHei",sans-serif';

function wrapText(ctx, text, maxW){
  const lines = [];
  for (const para of String(text).split('\n')) {
    if (!para) { lines.push(''); continue; }
    let line = '';
    for (const ch of para) {
      if (ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; }
      else line += ch;
    }
    lines.push(line);
  }
  return lines;
}
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function tape(ctx,x,y,w,color,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  ctx.fillStyle = color; ctx.fillRect(-w/2,-16,w,32);
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(-w/2,-16,w,9);
  ctx.restore();
}

function drawJournal(cmts){
  return new Promise((resolve, reject) => {
    try {
      // 画布宽度按设备自适应：手机用 720px 窄画布，同样字号在手机上显示更大
      const isMobile = Math.min(screen.width, screen.height) <= 768;
      const W = isMobile ? 720 : 1000;
      const M = Math.round(W * 0.056);
      const cv = document.createElement('canvas');
      const ctx = cv.getContext('2d');
      const maxW = W - M*2 - Math.round(W*0.064);
      // 字号随画布宽度缩放：手机画布窄、字号比例更大
      const FS = { title: Math.round(W*0.042), cmt: Math.round(W*0.030), content: Math.round(W*0.026), meta: Math.round(W*0.024) };
      ctx.font = `${FS.title}px ${FONT}`;
      const titleLines = wrapText(ctx, $('pTitle').textContent, maxW);
      ctx.font = `${FS.content}px ${FONT}`;
      const contentLines = wrapText(ctx, ($('pContent').textContent||'').slice(0,500), maxW);
      const cmtLines = cmts.map(c => { ctx.font = `${FS.cmt}px ${FONT}`; return { who:c.author||'匿名', likes:c.likes||0, lines: wrapText(ctx, c.content, maxW-40) }; });
      const LH = Math.round(W*0.042);
      const titleH = 90 + titleLines.length*(FS.title+8);
      const contentH = contentLines.length ? 50 + contentLines.length*(FS.content+16) : 0;
      const cmtH = cmtLines.reduce((s,c)=> s + 100 + c.lines.length*(FS.cmt+14), 0);
      const H = Math.max(1000, M*2 + titleH + contentH + cmtH + 150);

      cv.width = W; cv.height = H;
      // 纸底 + 点阵
      ctx.fillStyle = '#faf6ef'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = 'rgba(170,150,120,.22)';
      for (let x=40;x<W;x+=36) for (let y=40;y<H;y+=36) { ctx.beginPath(); ctx.arc(x,y,1.6,0,7); ctx.fill(); }
      tape(ctx, M+110, 38, 130, WASHI[0], -.12);
      tape(ctx, W-M-110, 38, 130, WASHI[1], .1);
      const d = new Date();
      ctx.fillStyle = '#b9ab99'; ctx.font = `24px sans-serif`; ctx.textAlign='right';
      ctx.fillText(`收藏于 ${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`, W-M, 72);
      ctx.textAlign='left';

      let y = M + 60;
      // 标题
      ctx.fillStyle = '#4a4038'; ctx.font = `bold ${FS.title}px ${FONT}`;
      titleLines.forEach(l => { ctx.fillText(l, M, y); y += FS.title+8; });
      y += 8;
      ctx.strokeStyle = '#e8837b'; ctx.lineWidth = 4; ctx.setLineDash([12,8]);
      ctx.beginPath(); ctx.moveTo(M,y); ctx.lineTo(M+Math.round(W*0.22),y); ctx.stroke(); ctx.setLineDash([]);
      y += 34;
      ctx.fillStyle = '#a09486'; ctx.font = `${FS.meta}px sans-serif`;
      ctx.fillText($('pMeta').textContent.split('·')[0].trim().slice(0,30), M, y);
      y += 32;
      // 原帖入口提示（不展示长链接）
      ctx.fillStyle = '#e8837b'; ctx.font = `${FS.meta}px ${FONT}`;
      ctx.fillText('🔗 原帖：见页面「点击打开原帖」按钮', M, y);
      y += 40;

      // 正文摘要
      if (contentLines.length){
        ctx.fillStyle = '#6b5f53'; ctx.font = `${FS.content}px ${FONT}`;
        contentLines.slice(0,12).forEach(l => { ctx.fillText(l, M, y); y += FS.content+16; });
        if (contentLines.length > 12) { ctx.fillStyle='#b0a494'; ctx.font=`${FS.meta}px sans-serif`; ctx.fillText('……（正文太长已截断）', M, y); y += 34; }
        y += 20;
      }

      // 评论便签（点赞倒序）
      cmtLines.forEach((c,idx) => {
        const h = 66 + c.lines.length*(FS.cmt+14);
        ctx.save();
        ctx.shadowColor = 'rgba(90,70,40,.18)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;
        ctx.fillStyle = NOTE_BG[idx % 4];
        roundRect(ctx, M + (idx%2? 14 : 0), y, W - M*2 - 24, h, 12); ctx.fill();
        ctx.restore();
        tape(ctx, W/2 + (idx%2? -34:34), y+5, 76, WASHI[idx % 4], (idx%2? -1:1)*.15);
        ctx.fillStyle = '#e8837b'; ctx.font = `bold ${FS.meta}px sans-serif`;
        ctx.fillText('#' + (idx+1), M + 26, y + 42);
        ctx.fillStyle = '#9a8f83'; ctx.font = `${FS.meta}px sans-serif`;
        ctx.fillText((c.who.slice(0,16) || '匿名'), M + Math.round(W*0.076), y + 42);
        ctx.fillStyle = '#e8a19b'; ctx.font = `${FS.meta}px sans-serif`; ctx.textAlign='right';
        ctx.fillText('👍 ' + c.likes, W - M - 40, y + 42);
        ctx.textAlign='left';
        ctx.fillStyle = '#4a4038'; ctx.font = `${FS.cmt}px ${FONT}`;
        let ly = y + 82;
        c.lines.forEach(l => { ctx.fillText(l, M + 26, ly); ly += FS.cmt+14; });
        y += h + 26;
      });

      ctx.fillStyle = '#c3b6a5'; ctx.font = `${FS.meta}px sans-serif`; ctx.textAlign='center';
      ctx.fillText('— 豆瓣手账 · ' + cmts.length + ' 条珍藏评论 —', W/2, H - 46);
      ctx.textAlign='left';

      // 输出：优先 blob（手机兼容好），失败回退 dataURL
      const img = $('imgOut');
      const applyUrl = url => { img.onload = ()=>resolve(); img.onerror = ()=>reject(new Error('图片渲染失败')); img.src = url; $('saveHint').textContent = ''; };
      if (cv.toBlob) {
        cv.toBlob(blob => {
          if (!blob) { applyUrl(cv.toDataURL('image/png')); return; }
          if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
          currentBlobUrl = URL.createObjectURL(blob);
          img.onload = ()=>resolve(); img.onerror = ()=>reject(new Error('图片渲染失败'));
          img.src = currentBlobUrl;
          // 存入手账本用 dataURL
          const small = document.createElement('canvas');
          const scale = Math.min(1, 800 / W);
          small.width = W*scale; small.height = H*scale;
          small.getContext('2d').drawImage(cv, 0, 0, small.width, small.height);
          currentEntry = currentEntry || {};
          currentEntry.fullDataUrl = cv.toDataURL('image/jpeg', 0.85);
          currentEntry.imgDataUrl = small.toDataURL('image/jpeg', 0.8);
          currentEntry.imgW = W; currentEntry.imgH = H;
        }, 'image/png');
      } else {
        applyUrl(cv.toDataURL('image/png'));
      }
    } catch(e){ reject(e); }
  });
}

// 轻量存储：只存文字数据，查看时现场重绘（drawEntry）
function drawEntry(cv, entry){
  return new Promise(resolve => {
    const cmts = [...(entry.comments||[])].sort((a,b)=>(b.likes||0)-(a.likes||0));
    const W = 1000, M = 56;
    const ctx = cv.getContext('2d');
    const maxW = W - M*2 - 64;
    const FS = { title: 42, cmt: 30, content: 26, meta: 24 };
    ctx.font = `${FS.title}px ${FONT}`;
    const titleLines = wrapText(ctx, entry.title || '(无标题)', maxW);
    ctx.font = `${FS.content}px ${FONT}`;
    const contentLines = wrapText(ctx, (entry.content||'').slice(0,500), maxW);
    const cmtLines = cmts.map(c => { ctx.font = `${FS.cmt}px ${FONT}`; return { who:c.author||'匿名', likes:c.likes||0, lines: wrapText(ctx, c.content, maxW-40) }; });
    const titleH = 90 + titleLines.length*(FS.title+8);
    const contentH = contentLines.length ? 50 + contentLines.length*(FS.content+16) : 0;
    const cmtH = cmtLines.reduce((s,c)=> s + 100 + c.lines.length*(FS.cmt+14), 0);
    const H = Math.max(1000, M*2 + titleH + contentH + cmtH + 150);
    cv.width = W; cv.height = H;
    ctx.fillStyle = '#faf6ef'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = 'rgba(170,150,120,.22)';
    for (let x=40;x<W;x+=36) for (let y=40;y<H;y+=36) { ctx.beginPath(); ctx.arc(x,y,1.6,0,7); ctx.fill(); }
    tape(ctx, M+110, 38, 130, WASHI[0], -.12);
    tape(ctx, W-M-110, 38, 130, WASHI[1], .1);
    const d = new Date((entry.ts||Date.now()));
    ctx.fillStyle = '#b9ab99'; ctx.font = '24px sans-serif'; ctx.textAlign='right';
    ctx.fillText(`收藏于 ${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`, W-M, 72);
    ctx.textAlign='left';
    let y = M + 60;
    ctx.fillStyle = '#4a4038'; ctx.font = `bold ${FS.title}px ${FONT}`;
    titleLines.forEach(l => { ctx.fillText(l, M, y); y += FS.title+8; });
    y += 8;
    ctx.strokeStyle = '#e8837b'; ctx.lineWidth = 4; ctx.setLineDash([12,8]);
    ctx.beginPath(); ctx.moveTo(M,y); ctx.lineTo(M+220,y); ctx.stroke(); ctx.setLineDash([]);
    y += 34;
    ctx.fillStyle = '#a09486'; ctx.font = '24px sans-serif';
    ctx.fillText((entry.author||'').split('·')[0].trim().slice(0,30), M, y);
    y += 32;
    ctx.fillStyle = '#e8837b'; ctx.font = `24px ${FONT}`;
    ctx.fillText('🔗 原帖：见页面「点击打开原帖」按钮', M, y);
    y += 40;
    if (contentLines.length){
      ctx.fillStyle = '#6b5f53'; ctx.font = `${FS.content}px ${FONT}`;
      contentLines.slice(0,12).forEach(l => { ctx.fillText(l, M, y); y += FS.content+16; });
      if (contentLines.length > 12) { ctx.fillStyle='#b0a494'; ctx.font='22px sans-serif'; ctx.fillText('……（正文太长已截断）', M, y); y += 34; }
      y += 20;
    }
    cmtLines.forEach((c,idx) => {
      const h = 66 + c.lines.length*(FS.cmt+14);
      ctx.save();
      ctx.shadowColor = 'rgba(90,70,40,.18)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;
      ctx.fillStyle = NOTE_BG[idx % 4];
      roundRect(ctx, M + (idx%2? 14 : 0), y, W - M*2 - 24, h, 12); ctx.fill();
      ctx.restore();
      tape(ctx, W/2 + (idx%2? -34:34), y+5, 76, WASHI[idx % 4], (idx%2? -1:1)*.15);
      ctx.fillStyle = '#e8837b'; ctx.font = 'bold 24px sans-serif';
      ctx.fillText('#' + (idx+1), M + 26, y + 42);
      ctx.fillStyle = '#9a8f83'; ctx.font = '23px sans-serif';
      ctx.fillText((c.who.slice(0,16) || '匿名'), M + 76, y + 42);
      ctx.fillStyle = '#e8a19b'; ctx.font = '23px sans-serif'; ctx.textAlign='right';
      ctx.fillText('👍 ' + c.likes, W - M - 40, y + 42);
      ctx.textAlign='left';
      ctx.fillStyle = '#4a4038'; ctx.font = `${FS.cmt}px ${FONT}`;
      let ly = y + 82;
      c.lines.forEach(l => { ctx.fillText(l, M + 26, ly); ly += FS.cmt+14; });
      y += h + 26;
    });
    ctx.fillStyle = '#c3b6a5'; ctx.font = '22px sans-serif'; ctx.textAlign='center';
    ctx.fillText('— 豆瓣手账 · ' + cmts.length + ' 条珍藏评论 —', W/2, H - 46);
    ctx.textAlign='left';
    resolve(cv);
  });
}

// 灯箱兼容：条目无图时现场重绘
async function entryImgOf(e){
  if (e.imgDataUrl && e.imgDataUrl.startsWith('data:')) return e.imgDataUrl;
  const cv = document.createElement('canvas');
  await drawEntry(cv, e);
  return cv.toDataURL('image/jpeg', 0.85);
}

$('confirmSaveBook').onclick = async () => {
  if (!currentEntry) return;
  const books = loadBooks();
  const b = books.find(x=>x.id === $('bookSelect').value);
  if (!b) return;
  // 轻量条目：只存文字，不存图片
  b.entries.unshift({ id: Date.now()+''+Math.floor(Math.random()*999),
    date: new Date().toLocaleDateString('zh-CN'), ts: Date.now(),
    title: currentEntry.title, url: currentEntry.url,
    author: currentEntry.author, content: $('pContent').textContent.slice(0,500),
    comments: currentEntry.comments });
  if (await saveBooks(books)) {
    alert('已存入手账本「' + b.name + '」✅');
    $('saveBookRow').style.display = 'none';
  }
};

// ============ 手账查看灯箱（左右滑动） ============
let lbEntries = [], lbIndex = 0;
async function openLightbox(entries, idx){
  lbEntries = entries; lbIndex = idx;
  // 先开壳（立即响应），图片并行生成后填充
  $('lbTrack').innerHTML = entries.map(()=>`<div class="lb-item"><div style="color:#c3b6a5;font-size:14px">绘制中…</div></div>`).join('');
  $('lightbox').classList.add('show');
  document.body.style.overflow = 'hidden';
  lbUpdate();
  const urls = await Promise.all(entries.map(e => entryImgOf(e)));
  entries.forEach((e,i) => { if (!e.thumbDataUrl) e.thumbDataUrl = urls[i]; }); // 缓存复用
  $('lbTrack').innerHTML = urls.map(u=>`<div class="lb-item"><img src="${u}" alt=""></div>`).join('');
  lbUpdate();
  // 滚轮翻页（PC）
  $('lbStage').onwheel = ev => { if (Math.abs(ev.deltaY) > 30) { ev.deltaY > 0 ? lbNext_() : lbPrev_(); } };
}
function lbUpdate(){
  $('lbTrack').style.transform = `translateX(-${lbIndex*100}%)`;
  $('lbCounter').textContent = `${lbIndex+1} / ${lbEntries.length}`;
  $('lbTitle').textContent = lbEntries[lbIndex] ? (lbEntries[lbIndex].title + ' · ' + lbEntries[lbIndex].date) : '';
  $('lbPrev').style.display = lbIndex > 0 ? 'flex' : 'none';
  $('lbNext').style.display = lbIndex < lbEntries.length-1 ? 'flex' : 'none';
}
function lbPrev_(){ if (lbIndex > 0){ lbIndex--; lbUpdate(); } }
function lbNext_(){ if (lbIndex < lbEntries.length-1){ lbIndex++; lbUpdate(); } }
$('lbPrev').onclick = lbPrev_;
$('lbNext').onclick = lbNext_;
$('lbClose').onclick = () => { $('lightbox').classList.remove('show'); document.body.style.overflow=''; };
$('lightbox').onclick = e => { if (e.target === $('lightbox') || e.target === $('lbStage')) $('lbClose').onclick(); };
// 键盘左右键（PC）
document.addEventListener('keydown', e => {
  if (!$('lightbox').classList.contains('show')) return;
  if (e.key === 'ArrowLeft') lbPrev_();
  if (e.key === 'ArrowRight' || e.key === 'Escape') e.key === 'Escape' ? $('lbClose').onclick() : lbNext_();
});
// 触摸滑动（手机）
let tx = null;
$('lbStage').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
$('lbStage').addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) { dx < 0 ? lbNext_() : lbPrev_(); }
  tx = null;
}, {passive:true});

// ============ 手账本管理 ============
let editingBookId = null;
async function renderBooks(){
  await ensureHydrated();
  const books = loadBooks();
  $('nbEmpty').style.display = books.length ? 'none' : 'block';
  $('nbGrid').innerHTML = books.map(b=>`
    <div class="nb-card" data-id="${b.id}">
      ${b.cover ? `<img class="nb-cover" src="${b.cover}">` : `<div class="nb-cover" style="display:flex;align-items:center;justify-content:center;font-size:34px">📒</div>`}
      <div class="nb-info">
        <div class="nb-name">${esc(b.name)}</div>
        <div class="nb-intro" style="${b.intro?'':'display:none'}">${esc(b.intro||'')}</div>
        <div class="nb-tags">${esc((b.tags||[]).map(t=>'#'+t).join(' '))}</div>
        <div class="nb-date">建于 ${b.createdAt} · ${b.entries.length} 篇</div>
      </div>
    </div>`).join('');
  $('nbGrid').querySelectorAll('.nb-card').forEach(el=> el.onclick = ()=>openBook(el.dataset.id));
}
let currentView = 'grid';
let currentBookId = null;
$('viewGrid').onclick = () => { currentView='grid'; renderEntries(); };
$('viewTimeline').onclick = () => { currentView='timeline'; renderEntries(); };

function openBook(id){
  currentBookId = id;
  const b = loadBooks().find(x=>x.id===id); if(!b) return;
  $('booksHome').style.display='none'; $('bookDetail').style.display='block';
  $('bdName').textContent = b.name;
  $('bdIntro').textContent = b.intro||'';
  $('bdIntro').style.display = b.intro ? 'block' : 'none';
  $('bdTags').textContent = (b.tags||[]).map(t=>'#'+t).join(' ');
  $('bdDate').textContent = '建于 ' + b.createdAt;
  renderEntries();
  $('editBookBtn').onclick = ()=>openBookModal(id);
  $('delBookBtn').onclick = ()=>{
    if (!confirm('删除整个手账本「'+b.name+'」及其全部内容？此操作不可恢复。')) return;
    saveBooks(loadBooks().filter(x=>x.id!==id));
    $('booksHome').style.display='block'; $('bookDetail').style.display='none';
    renderBooks();
  };
}
$('backBooks').onclick = ()=>{ $('booksHome').style.display='block'; $('bookDetail').style.display='none'; };

// ============ 条目渲染：九宫格 / 时间线 双视图 + 编辑操作 ============
async function renderEntries(){
  await ensureHydrated();
  const b = loadBooks().find(x=>x.id===currentBookId); if(!b) return;
  // 轻量条目（无图）并行生成缩略图（提速：串行改并行）
  await Promise.all(b.entries.map(async e => {
    if (!e.thumbDataUrl){
      if (e.imgDataUrl && e.imgDataUrl.startsWith('data:')) e.thumbDataUrl = e.imgDataUrl;
      else e.thumbDataUrl = await entryImgOf(e);
    }
  }));
  $('viewGrid').classList.toggle('active', currentView==='grid');
  $('viewTimeline').classList.toggle('active', currentView==='timeline');
  $('entryEmpty').style.display = b.entries.length ? 'none':'block';
  const grid = $('entryGrid');
  if (currentView === 'grid'){
    grid.style.display = 'grid';
    grid.innerHTML = b.entries.map(e=>`
      <div class="entry-card" data-id="${e.id}">
        <img class="entry-thumb" src="${e.thumbDataUrl || e.imgDataUrl}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22150%22%3E%3Crect fill=%22%23faf6ef%22 width=%22150%22 height=%22150%22/%3E%3Ctext x=%2275%22 y=%2280%22 text-anchor=%22middle%22 fill=%22%23b0a494%22 font-size=%2212%22%3E图片已失效%3C/text%3E%3C/svg%3E'">
        <div class="entry-title">${esc(e.title)}<br><span style="color:#c3b6a5;font-size:11px">${e.date} · ${(e.comments||[]).length}条评论</span></div>
        <div class="entryOps">
          <button data-act="move" data-id="${e.id}">移动</button>
          <button data-act="del" data-id="${e.id}">删除</button>
        </div>
      </div>`).join('');
  } else {
    // 时间线：按日期倒序分组
    grid.style.display = 'block';
    const groups = {};
    b.entries.forEach(e => { (groups[e.date||'未知日期'] = groups[e.date||'未知日期'] || []).push(e); });
    const dates = Object.keys(groups).sort((a,b2)=>b2.localeCompare(a));
    grid.innerHTML = dates.map(d=>`
      <div class="tl-group">
        <div class="tl-date">${esc(d)}</div>
        <div class="tl-row">
          ${groups[d].map(e=>`<img class="tl-thumb" src="${e.thumbDataUrl || e.imgDataUrl}" data-id="${e.id}" title="${esc(e.title)}">`).join('')}
        </div>
      </div>`).join('') || '';
  }
  // 统一交互：点图片/卡片开灯箱，点按钮执行操作
  grid.querySelectorAll('img[data-id], .entry-card').forEach(el=>{
    el.onclick = ev => {
      if (ev.target.dataset.act) return; // 按钮有自己的处理
      const eid = el.dataset.id || el.closest('[data-id]').dataset.id;
      const e = b.entries.find(x=>x.id===eid);
      if (e) openLightbox(b.entries, b.entries.indexOf(e));
    };
  });
  grid.querySelectorAll('.entryOps button').forEach(btn=>{
    btn.onclick = ev => {
      ev.stopPropagation();
      const eid = btn.dataset.id;
      if (btn.dataset.act === 'del'){
        if (!confirm('删除这篇手账？')) return;
        const books = loadBooks(); const b2 = books.find(x=>x.id===currentBookId);
        b2.entries = b2.entries.filter(e=>e.id !== eid);
        saveBooks(books); renderEntries();
      } else if (btn.dataset.act === 'move'){
        const books = loadBooks();
        const others = books.filter(x=>x.id!==currentBookId);
        if (!others.length){ alert('没有其他手账本可以移动，先新建一个～'); return; }
        const names = others.map(o=>o.name).join('、');
        const target = prompt('移动到哪个手账本？可选项：' + names, others[0].name);
        if (!target) return;
        const to = books.find(x=>x.name===target.trim() && x.id!==currentBookId);
        if (!to){ alert('名字不对，请完整输入：' + names); return; }
        const from = books.find(x=>x.id===currentBookId);
        const idx = from.entries.findIndex(e=>e.id===eid);
        to.entries.unshift(from.entries[idx]);
        from.entries.splice(idx,1);
        saveBooks(books); renderEntries();
        alert('已移动到「'+to.name+'」✅');
      }
    };
  });
}

function openBookModal(id){
  editingBookId = id || null;
  const b = id ? loadBooks().find(x=>x.id===id) : null;
  $('bmTitle').textContent = b ? '编辑手账本' : '新建手账本';
  $('bmName').value = b ? b.name : '';
  $('bmIntro').value = b ? (b.intro||'') : '';
  $('bmTags').value = b ? (b.tags||[]).join(' ') : '';
  $('bmDate').textContent = b ? '建于 ' + b.createdAt : '';
  coverDataUrl = b ? b.cover : null;
  $('bmCoverImg').style.display = coverDataUrl ? 'block':'none';
  if (coverDataUrl) $('bmCoverImg').src = coverDataUrl;
  $('bookModal').classList.add('show');
}
let coverDataUrl = null;
$('newBookBtn').onclick = ()=>openBookModal(null);
$('bmCancel').onclick = ()=>$('bookModal').classList.remove('show');
$('bmCoverBtn').onclick = ()=>$('bmCoverFile').click();
$('bmCoverFile').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    // 压缩到 400px 宽，省存储
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      const s = Math.min(1, 400/img.width);
      c.width = img.width*s; c.height = img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      coverDataUrl = c.toDataURL('image/jpeg',0.8);
      $('bmCoverImg').src = coverDataUrl; $('bmCoverImg').style.display='block';
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
};
$('bmSave').onclick = () => {
  const name = $('bmName').value.trim();
  if (!name) { alert('给手账本起个名字～'); return; }
  const books = loadBooks();
  if (editingBookId) {
    const b = books.find(x=>x.id===editingBookId);
    Object.assign(b, { name, intro:$('bmIntro').value.trim(), tags:$('bmTags').value.trim().split(/\s+/).filter(Boolean), cover: coverDataUrl });
  } else {
    books.unshift({ id: Date.now()+''+Math.floor(Math.random()*999), name, intro:$('bmIntro').value.trim(),
      tags:$('bmTags').value.trim().split(/\s+/).filter(Boolean), cover: coverDataUrl,
      createdAt: new Date().toLocaleDateString('zh-CN'), entries: [] });
  }
  saveBooks(books);
  $('bookModal').classList.remove('show');
  renderBooks();
};
</script>
